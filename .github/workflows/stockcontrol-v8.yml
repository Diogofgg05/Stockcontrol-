name: StockControl V8 visual review and source snapshot
on:
  push:
    branches: ['feat/stockcontrol-v8-premium-light']
  pull_request:
    paths:
      - 'portal_php/public/assets/design-v5/**'
      - '.github/workflows/stockcontrol-v8.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: stockcontrol-v8-source
          path: |
            portal_php/public/assets/design-v5/
            tests/stockcontrol_v5_browser.cjs
            tests/stockcontrol_v5_model.test.cjs
          retention-days: 2
  visual-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reproducible JavaScript bundle
        run: node portal_php/public/assets/design-v5/tools/build.cjs --check
      - name: Unit and syntax tests
        run: |
          node --check portal_php/public/assets/design-v5/app.js
          node --test tests/stockcontrol_v5_model.test.cjs
      - name: Install browser for visual testing
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Capture real web application and mobile view
        run: node --test tests/stockcontrol_v5_browser.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockcontrol-v8-real-screenshots
          path: tests/v5-previews/
          retention-days: 14
          if-no-files-found: ignore
