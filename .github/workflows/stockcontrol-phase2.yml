name: StockControl Phase 2 Inventory API
on:
  push:
    branches: [main, 'feat/stockcontrol-phase2-operations']
    paths:
      - 'backend/phase1/**'
      - 'tests/test_phase1_api.py'
      - 'tests/test_phase2_api.py'
      - 'backend/phase1/static/**'
      - '.github/workflows/stockcontrol-phase2.yml'
  pull_request:
    paths:
      - 'backend/phase1/**'
      - 'tests/test_phase2_api.py'
      - '.github/workflows/stockcontrol-phase2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/phase1/requirements.txt
          python -m pip install pytest httpx
      - name: Python compile
        run: |
          python -m py_compile backend/phase1/main.py backend/phase1/operations.py
          python -m py_compile tests/test_phase1_api.py tests/test_phase2_api.py
      - name: Existing administration and new stock regression tests
        run: python -m pytest -q tests/test_phase1_api.py tests/test_phase2_api.py
      - name: Upload reproducible source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockcontrol-phase2-api
          path: |
            backend/phase1/
            tests/test_phase2_api.py
          if-no-files-found: ignore
          retention-days: 7
