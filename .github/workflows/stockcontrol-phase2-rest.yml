name: StockControl Phase 2 Complete UI
on:
  push:
    branches: [main, 'feat/stockcontrol-phase2-rest-of-ui']
    paths:
      - 'backend/phase1/**'
      - 'tests/test_phase2_rest.py'
      - 'tests/test_phase2_browser.py'
      - 'tests/test_phase1_browser.py'
      - '.github/workflows/stockcontrol-phase2-rest.yml'
  pull_request:
    paths:
      - 'backend/phase1/**'
      - 'tests/test_phase2_rest.py'
      - 'tests/test_phase2_browser.py'
      - 'tests/test_phase1_browser.py'
      - '.github/workflows/stockcontrol-phase2-rest.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: stockcontrol-rest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install -r backend/phase1/requirements.txt
          python -m pip install pytest httpx
      - name: Compile and check frontend syntax
        run: |
          python -m py_compile backend/phase1/main.py backend/phase1/operations.py
          node --check backend/phase1/static/app.js
          node --check backend/phase1/static/stock-rest.js
          node --check backend/phase1/static/stock-ui.js
          node --check backend/phase1/static/stock-ux.js
      - name: Server regression and permissions
        run: |
          python -m pytest -q tests/test_phase1_api.py tests/test_phase2_api.py tests/test_phase2_media.py tests/test_phase2_rest.py
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and API
        run: |
          python -m pip install -r backend/phase1/requirements.txt
          python -m pip install pytest httpx playwright
          python -m playwright install --with-deps chromium
      - name: Run full authenticated desktop/mobile flows
        run: python -m pytest -q tests/test_phase1_browser.py tests/test_phase2_browser.py
      - name: Publish actual screenshots from browser
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockcontrol-rest-complete-screenshots
          path: tests/phase2-previews/
          if-no-files-found: ignore
          retention-days: 14
